name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: europe-west1-docker.pkg.dev/rubenschulze-sandbox/math-mcp-learning-server/server

jobs:
  host:
    name: Verify on host (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src/
      - run: uv run pytest

  docker:
    name: Verify inside container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image (layer-cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: math-mcp-learning-server:deploy-verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run test suite inside the image
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}":/src:ro
          -e UV_PROJECT_ENVIRONMENT=/tmp/venv math-mcp-learning-server:deploy-verify
          sh -c "cd /src && uv sync --frozen --all-extras --no-install-project && uv run --no-sync pytest"

  deploy:
    name: Build, publish, and deploy to Cloud Run
    needs: [host, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Workload Identity provider variable
        env:
          WIF_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "vars.WORKLOAD_IDENTITY_PROVIDER is not set." >&2
            echo "Run the one-time GCP setup in docs/CLOUD_DEPLOYMENT.md, then:" >&2
            pool="projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools"
            echo "  gh variable set WORKLOAD_IDENTITY_PROVIDER --body '$pool/github-actions/providers/math-mcp' -R 5pirit5eal/math-mcp-learning-server" >&2
            exit 1
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@rubenschulze-sandbox.iam.gserviceaccount.com
      - name: Log in to Artifact Registry
        run: >-
          gcloud auth print-access-token |
          docker login -u oauth2accesstoken --password-stdin europe-west1-docker.pkg.dev
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: math-mcp-learning-server
          region: europe-west1
          project_id: rubenschulze-sandbox
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          env_vars: MCP_TRANSPORT=http,MCP_STATELESS_HTTP=true
          flags: >-
            --allow-unauthenticated
            --service-account=math-mcp-runtime@rubenschulze-sandbox.iam.gserviceaccount.com
            --set-secrets=MCP_AUTH_TOKEN=mcp-auth-token:latest
            --startup-probe=httpGet.path=/healthz,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=1,timeoutSeconds=1,failureThreshold=60
