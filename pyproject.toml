[project]
name = "math-mcp-learning-server"
version = "1.0.0"
description = "Educational MCP server for math operations, statistics, visualization, and persistent workspaces. Built with FastMCP."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
keywords = ["mcp", "math", "calculator", "fastmcp", "education"]
dependencies = [
    "fastmcp>=4.1.0,<4.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/5pirit5eal/math-mcp-learning-server"
Repository = "https://github.com/5pirit5eal/math-mcp-learning-server"
Issues = "https://github.com/5pirit5eal/math-mcp-learning-server/issues"

[project.scripts]
math-mcp-learning-server = "math_mcp.server:main"

[project.optional-dependencies]
plotting = [
    "matplotlib>=3.10.6",
    "numpy>=2.4.4",
]
scientific = [
    "numpy>=2.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_mcp"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11.0",
    # Pin ruff >=0.15.1: formatting regression in 0.15.0 strips parentheses
    # from multi-exception except clauses when target-version = "py314" (invalid syntax).
    "ruff>=0.17.1,<0.18.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.2",
    "pyyaml>=6.0.2",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SLF001",  # private member access
]
ignore = [
    "E501",  # Line too long - formatter handles most cases
    "B904",  # raise-without-from - acceptable for this educational project
]

[tool.ruff.lint.per-file-ignores]
# Late imports in tests (conftest clears auth env before importing the server,
# which requires imports after the os.environ.pop); SLF001: tests necessarily
# poke at private state (middleware limiters, mock ctx._state).
"tests/**/*.py" = ["F401", "E402", "SLF001"]
# Reach into private helpers across module boundaries: the workspace loader
# (resources.py) and the matplotlib backend setup (tools/visualization.py).
"src/math_mcp/resources.py" = ["SLF001"]
"src/math_mcp/tools/visualization.py" = ["SLF001"]

[tool.mypy]
python_version = "3.14"
